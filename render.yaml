services:
  - type: web
    name: digital-card
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true

    # preDeployCommand: 'npx prisma migrate deploy && npx prisma db seed'

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: digital-card-db
          property: connectionString

databases:
  - name: digital-card-db
    plan: free
    user: card_admin
    databaseName: digital_card
